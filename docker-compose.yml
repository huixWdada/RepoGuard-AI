
services:
  postgres:
    image: postgres:16
    container_name: repoguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: repoguard
      POSTGRES_USER: repoguard_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U repoguard_user -d repoguard
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: repoguard-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
